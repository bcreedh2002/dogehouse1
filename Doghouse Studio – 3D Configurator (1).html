<script>
// Layout preferences are separate from designs and do not create customization history entries.
(()=>{
 const handle=document.getElementById('panel-resizer'),panel=document.getElementById('p'),mobile=matchMedia('(max-width:760px), (pointer:coarse) and (max-height:600px)'),landscape=matchMedia('(orientation:landscape)'),key='doghouse-studio.panel-layout.v1';
 const defaults={portrait:.48,landscape:.45},preferences={...defaults};let dragging=null,frame=0,pendingSize;
 try{const saved=JSON.parse(localStorage.getItem(key)||'null');for(const mode of ['portrait','landscape'])if(Number.isFinite(saved?.[mode])&&saved[mode]>0&&saved[mode]<1)preferences[mode]=saved[mode]}catch(error){}
 const mode=()=>landscape.matches?'landscape':'portrait';
 function bounds(){const horizontal=mode()==='portrait',total=horizontal?document.body.clientHeight:document.body.clientWidth,divider=horizontal?handle.offsetHeight:handle.offsetWidth,available=Math.max(0,total-divider),min=Math.min(horizontal?200:175,available*.55),max=Math.max(min,available-(horizontal?180:120));return {total,min,max,horizontal}}
 function applySize(size,user=false){
  if(!mobile.matches)return;const limits=bounds();if(!limits.total)return;
  const pixels=Math.max(limits.min,Math.min(limits.max,size)),ratio=pixels/limits.total;
  document.body.style.setProperty('--panel-'+mode()+'-size',(ratio*100)+'%');
  handle.setAttribute('aria-orientation',limits.horizontal?'horizontal':'vertical');handle.setAttribute('aria-valuemin',(limits.min/limits.total*100).toFixed(1));handle.setAttribute('aria-valuemax',(limits.max/limits.total*100).toFixed(1));handle.setAttribute('aria-valuenow',(ratio*100).toFixed(1));handle.setAttribute('aria-valuetext','Controls use '+Math.round(ratio*100)+'% of screen '+(limits.horizontal?'height':'width'));handle.setAttribute('aria-disabled',limits.min===limits.max);
  if(user)preferences[mode()]=ratio;
 }
 function persist(){try{localStorage.setItem(key,JSON.stringify(preferences))}catch(error){}}
 function flush(){if(frame){cancelAnimationFrame(frame);frame=0}if(pendingSize!==undefined){applySize(pendingSize,true);pendingSize=undefined}}
 function finish(save=true){if(!dragging)return;if(save)flush();else{if(frame)cancelAnimationFrame(frame);frame=0;pendingSize=undefined}const pointer=dragging.pointer;dragging=null;document.body.classList.remove('resizing-panel');if(handle.hasPointerCapture(pointer))handle.releasePointerCapture(pointer);if(save)persist()}
 function refresh(){finish(false);if(!mobile.matches&&document.activeElement===handle){handle.blur();if(!panel.inert)panel.querySelector('#save-shortcut')?.focus({preventScroll:true})}handle.tabIndex=mobile.matches?0:-1;handle.setAttribute('aria-hidden',!mobile.matches);if(mobile.matches)applySize(preferences[mode()]*bounds().total)}
 handle.addEventListener('pointerdown',event=>{if(!mobile.matches||event.button!==0||dragging)return;const limits=bounds();if(limits.min===limits.max)return;event.preventDefault();handle.focus({preventScroll:true});dragging={pointer:event.pointerId,start:limits.horizontal?event.clientY:event.clientX,size:limits.horizontal?panel.getBoundingClientRect().height:panel.getBoundingClientRect().width,horizontal:limits.horizontal};handle.setPointerCapture(event.pointerId);document.body.classList.add('resizing-panel')});
 handle.addEventListener('pointermove',event=>{if(!dragging||event.pointerId!==dragging.pointer)return;pendingSize=dragging.size+dragging.start-(dragging.horizontal?event.clientY:event.clientX);if(!frame)frame=requestAnimationFrame(()=>{frame=0;flush()})});
 handle.addEventListener('pointerup',event=>{if(dragging?.pointer===event.pointerId)finish()});handle.addEventListener('pointercancel',()=>finish());handle.addEventListener('lostpointercapture',()=>finish());
 function reset(){if(!mobile.matches)return;finish(false);preferences[mode()]=defaults[mode()];applySize(preferences[mode()]*bounds().total);persist()}
 handle.addEventListener('dblclick',reset);
 handle.addEventListener('keydown',event=>{if(!mobile.matches)return;const limits=bounds(),current=limits.horizontal?panel.getBoundingClientRect().height:panel.getBoundingClientRect().width;let size;
  if(event.key==='Enter'){event.preventDefault();reset();return}
  if(event.key==='Home')size=limits.min;else if(event.key==='End')size=limits.max;
  else if(limits.horizontal&&['ArrowUp','ArrowDown'].includes(event.key))size=current+(event.key==='ArrowUp'?1:-1)*(event.shiftKey?40:16);
  else if(!limits.horizontal&&['ArrowLeft','ArrowRight'].includes(event.key))size=current+(event.key==='ArrowLeft'?1:-1)*(event.shiftKey?40:16);
  else return;event.preventDefault();applySize(size,true);persist();
 });
 window.addEventListener('resize',refresh);mobile.addEventListener('change',refresh);landscape.addEventListener('change',refresh);refresh();
})();
window.doghouseBoot=(()=>{
 const status=document.getElementById('viewer-status'),message=document.getElementById('viewer-message'),retry=document.getElementById('retry-viewer');let loading=false,started=false,readyOnce=false,recoveryTimer;
 function fail(text){clearTimeout(recoveryTimer);status.hidden=false;message.textContent=text;retry.hidden=false;document.getElementById('vw').inert=true;document.getElementById('history-controls').inert=!readyOnce;document.getElementById('p').inert=!readyOnce}
 function ready(){clearTimeout(recoveryTimer);readyOnce=true;status.hidden=true;retry.hidden=true;document.getElementById('vw').inert=false;document.getElementById('history-controls').inert=false;document.getElementById('p').inert=false}
 function lost(){status.hidden=false;message.textContent='The 3D preview was interrupted. Restoring it…';retry.hidden=true;document.getElementById('vw').inert=true;document.getElementById('history-controls').inert=!readyOnce;recoveryTimer=setTimeout(()=>fail('The 3D preview has not recovered. Retry the viewer to restore your current design.'),8000)}
 function loadScript(url){return new Promise((resolve,reject)=>{const script=document.createElement('script');let settled=false;const timeout=setTimeout(()=>finish(new Error('Dependency timeout')),12000);function finish(error){if(settled)return;settled=true;clearTimeout(timeout);script.onload=script.onerror=null;if(error){script.remove();reject(error)}else resolve()}script.src=url;script.onload=()=>finish();script.onerror=()=>finish(new Error('Dependency unavailable'));document.head.append(script)})}
 async function initialize(){if(loading||started)return;loading=true;status.hidden=false;retry.hidden=true;message.textContent='Loading the 3D viewer…';
  try{await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js');await loadScript('https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js');started=true;
   const script=document.createElement('script');script.textContent=document.getElementById('configurator-code').textContent;document.body.append(script);
  }catch(error){fail('The 3D viewer could not download its required files. Check your connection and retry.')}finally{loading=false}}
 window.addEventListener('error',event=>{if(started&&!readyOnce){event.preventDefault();fail('The 3D viewer could not start. Your browser may not support WebGL. Check hardware acceleration and retry.')}});
 retry.onclick=()=>{if(!started){initialize();return}try{if(readyOnce&&window.getDoghouseDraft)sessionStorage.setItem('doghouse-studio.viewer-draft',JSON.stringify(window.getDoghouseDraft()));location.reload()}catch(error){fail('The viewer could not preserve your current design for reload. Export your design before reloading.')}};
 return {initialize,ready,fail,lost};
})();
